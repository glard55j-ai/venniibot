name: Construire APK Venii Local
on:
  workflow_dispatch:
  push:
    branches: [main, venii-local-v2, kooma-cartographie-v4]
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Installer SDK Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Tester le lecteur cartographique hors ligne
        run: |
          mkdir -p /tmp/kooma-map-test
          javac -encoding UTF-8 -d /tmp/kooma-map-test app/src/main/java/com/veniilocal/MapPayloadInspector.java tools/MapPayloadInspectorSelfTest.java
          java -cp /tmp/kooma-map-test MapPayloadInspectorSelfTest
      - name: Compiler APK debug
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VeniiLocal-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
